services:
  postgres:
    image: postgres:16-alpine
    container_name: articles_postgres
    environment:
      POSTGRES_DB: articles_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
    networks:
      - articles_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: articles_backend
    ports:
      - "3000:3000"
    environment:
      - DB_NAME=articles_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres_secret
      - DB_HOST=postgres
      - DB_PORT=5432
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - articles_network
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  articles_network:
    driver: bridge